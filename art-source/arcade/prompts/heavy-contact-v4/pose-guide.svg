<g font-family="sans-serif" font-size="25" fill="#28334a"><text x="25" y="40">CONTACT POSE GUIDE — geometry only, not final art</text><text x="650" y="355">near shoulder</text><text x="905" y="380">elbow</text><text x="1090" y="435">wrist / fist</text><text x="1080" y="640">Slight bend. Straight wrist.</text><text x="1080" y="680">No curved sleeve or hinge.</text><text x="20" y="1520">Planted feet. Lean comes from torso, not a stretched upper arm.</text></g></svg>
