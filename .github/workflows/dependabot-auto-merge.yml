name: Dependabot auto-merge

# Patch, minor and security updates from Dependabot merge themselves once the
# required checks pass: this only turns GitHub auto-merge on, and branch protection
# on main still waits for quality, browser-smoke and the dependency guard.
# Major versions change behaviour, so they are never auto-merged. They get the
# `major-update` label and a comment asking the owner to review.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - name: Auto-merge patch, minor and security updates once CI is green
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          UPDATE: ${{ steps.meta.outputs.update-type }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
        run: |
          echo "Auto-merge enabled for $UPDATE: $DEPS"
          gh pr merge --auto --squash "$PR"
      - name: Hold major updates for the owner
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
          FROM: ${{ steps.meta.outputs.previous-version }}
          TO: ${{ steps.meta.outputs.new-version }}
        run: |
          gh pr edit "$PR" --add-label major-update
          if [ "${{ github.event.action }}" = "opened" ]; then
            gh pr comment "$PR" --body "Major update ($DEPS $FROM → $TO): not auto-merged, because a major version can change behaviour. Review the release notes and CI, then merge by hand."
          fi
